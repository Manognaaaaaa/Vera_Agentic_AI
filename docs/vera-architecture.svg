<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="#9ca3af"/>
</marker>
</defs>
<rect x="0" y="0" width="760" height="560" fill="#ffffff"/>

<text x="24" y="32" font-size="15" font-weight="600" fill="#111827">Policy runs before every booking and the LLM never decides money</text>

<!-- key -->
<rect x="24" y="47" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/>
<text x="44" y="58" font-size="11.5" fill="#6b7280">LLM node</text>
<rect x="124" y="47" width="14" height="14" rx="3" fill="none" stroke="#9ca3af" stroke-width="1.25"/>
<text x="144" y="58" font-size="11.5" fill="#6b7280">Deterministic code</text>
<rect x="274" y="47" width="14" height="14" rx="3" fill="#e6f6ec" stroke="#16a34a" stroke-width="2"/>
<text x="294" y="58" font-size="11.5" fill="#6b7280">Human in the loop</text>

<!-- connectors -->
<g fill="none" stroke="#9ca3af" stroke-width="1.25">
<path d="M104 98V112" marker-end="url(#arrow)"/>
<path d="M184 140H208" marker-end="url(#arrow)"/>
<path d="M368 140H392" marker-end="url(#arrow)"/>
<path d="M552 140H576" marker-end="url(#arrow)"/>
<path d="M656 168V232" marker-end="url(#arrow)"/>
<path d="M576 260H552" marker-end="url(#arrow)"/>
<path d="M392 260H352" marker-end="url(#arrow)"/>
<path d="M224 260H104V352" marker-end="url(#arrow)"/>
<path d="M288 296V352" marker-end="url(#arrow)"/>
<path d="M208 380H184" marker-end="url(#arrow)"/>
<path d="M368 380H656V288" marker-end="url(#arrow)"/>
<path d="M104 408V440" marker-end="url(#arrow)"/>
<path d="M288 408V440" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
</g>

<text x="104" y="92" text-anchor="middle" font-size="11.5" fill="#6b7280">Traveller message</text>

<!-- row A -->
<rect x="24" y="112" width="160" height="56" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/>
<text x="104" y="136" text-anchor="middle" font-weight="600" fill="#111827">Intake</text>
<text x="104" y="154" text-anchor="middle" font-size="11.5" fill="#6b7280">text to TripIntent</text>
<rect x="208" y="112" width="160" height="56" rx="8" fill="none" stroke="#9ca3af" stroke-width="1.25"/>
<text x="288" y="136" text-anchor="middle" font-weight="600" fill="#111827">Calendar check</text>
<text x="288" y="154" text-anchor="middle" font-size="11.5" fill="#6b7280">free/busy, in UTC</text>
<rect x="392" y="112" width="160" height="56" rx="8" fill="none" stroke="#9ca3af" stroke-width="1.25"/>
<text x="472" y="136" text-anchor="middle" font-weight="600" fill="#111827">Flight search</text>
<text x="472" y="154" text-anchor="middle" font-size="11.5" fill="#6b7280">mock GDS, cached</text>
<rect x="576" y="112" width="160" height="56" rx="8" fill="none" stroke="#9ca3af" stroke-width="1.25"/>
<text x="656" y="136" text-anchor="middle" font-weight="600" fill="#111827">Policy engine</text>
<text x="656" y="154" text-anchor="middle" font-size="11.5" fill="#6b7280">every rule reading</text>
<!-- row B -->
<rect x="576" y="232" width="160" height="56" rx="8" fill="none" stroke="#9ca3af" stroke-width="1.25"/>
<text x="656" y="256" text-anchor="middle" font-weight="600" fill="#111827">Rank options</text>
<text x="656" y="274" text-anchor="middle" font-size="11.5" fill="#6b7280">weighted score</text>
<rect x="392" y="232" width="160" height="56" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/>
<text x="472" y="256" text-anchor="middle" font-weight="600" fill="#111827">Explain</text>
<text x="472" y="274" text-anchor="middle" font-size="11.5" fill="#6b7280">must cite rule IDs</text>
<polygon points="224,260 288,224 352,260 288,296" fill="#ffffff" stroke="#9ca3af" stroke-width="1.25"/>
<text x="288" y="264" text-anchor="middle" fill="#111827">In policy?</text>
<!-- row C -->
<rect x="24" y="352" width="160" height="56" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.25"/>
<text x="104" y="376" text-anchor="middle" font-weight="600" fill="#111827">Book</text>
<text x="104" y="394" text-anchor="middle" font-size="11.5" fill="#6b7280">re-check fare first</text>
<rect x="208" y="352" width="160" height="56" rx="8" fill="#e6f6ec" stroke="#16a34a" stroke-width="2"/>
<text x="288" y="376" text-anchor="middle" font-weight="600" fill="#111827">Manager approval</text>
<text x="288" y="394" text-anchor="middle" font-size="11.5" fill="#6b7280">interrupt(), waits</text>
<!-- edge labels -->

<text x="164" y="252" text-anchor="middle" font-size="11.5" fill="#6b7280">in policy</text>
<text x="296" y="328" font-size="11.5" fill="#6b7280">out of policy</text>
<text x="196" y="344" text-anchor="middle" font-size="11.5" fill="#6b7280">approved</text>
<text x="512" y="372" text-anchor="middle" font-size="11.5" fill="#6b7280">rejected, re-rank</text>
<text x="112" y="428" font-size="11.5" fill="#6b7280">audit record</text>
<text x="296" y="428" font-size="11.5" fill="#6b7280">pause / resume</text>

<!-- bands -->
<rect x="24" y="440" width="712" height="40" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.25"/>
<text x="380" y="465" text-anchor="middle" fill="#111827">Postgres: graph checkpoints + append-only audit log</text>
<rect x="24" y="496" width="712" height="40" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.25"/>
<text x="380" y="521" text-anchor="middle" fill="#111827">Eval harness replays 150+ scenarios through this graph; LangSmith traces every node</text>
</svg>
